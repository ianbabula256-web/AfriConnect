<style>
:root{--bg:#F3F7FA;--surface:rgba(255,255,255,.84);--surface2:#fff;--ink:#102A43;--mut:#486581;--line:#D5DFE8;--blue:#0B6FA4;--teal:#0F766E;--amber:#B45309;--red:#B42318;--green:#147D4A;--purple:#7C3AED;--shadow:0 18px 55px rgba(16,42,67,.14);--glass:rgba(255,255,255,.24)}
[data-theme=dark]{--bg:#0B1724;--surface:rgba(19,38,58,.78);--surface2:#13263A;--ink:#EAF2F8;--mut:#A9BCCD;--line:#2A4560;--blue:#6CC4F5;--teal:#56D4C7;--amber:#FCD34D;--red:#FF8B82;--green:#5DDB99;--purple:#B9A0FF;--shadow:0 18px 55px rgba(0,0,0,.34);--glass:rgba(19,38,58,.42)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}body{overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-2}.veil{position:fixed;inset:0;background:linear-gradient(180deg,rgba(2,18,39,.03),rgba(2,18,39,.22));z-index:-1;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#0B6FA4,#0F766E);display:grid;place-items:center;box-shadow:0 8px 28px rgba(11,111,164,.25)}.mark svg{width:29px}.word{font-weight:800;letter-spacing:.08em}.small{font-size:12px;color:var(--mut)}.actions{display:flex;gap:7px}.btn,.select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}.btn.primary{background:var(--blue);border-color:transparent;color:#fff}.btn.warn{background:rgba(180,83,9,.12);border-color:rgba(180,83,9,.3)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 35%,transparent);outline-offset:2px}
.nav{display:flex;gap:7px;overflow:auto;padding:3px 0 12px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 13px;border-radius:999px}.nav button.active{background:var(--ink);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:16px}.hero{padding:20px}.hero h1{margin:4px 0 5px;font-size:clamp(30px,7vw,48px);letter-spacing:-.04em}.hero p{color:var(--mut);max-width:800px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.section{margin-top:12px}.label{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}.value{font-size:28px;font-weight:700}.muted{color:var(--mut)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wraprow{display:flex;flex-wrap:wrap;gap:8px}.field{display:grid;gap:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--ink);padding:10px 11px}.field textarea{min-height:88px;resize:vertical}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:6px 9px;border-radius:999px;background:rgba(11,111,164,.1);border:1px solid rgba(11,111,164,.2);font-size:12px}.status{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:700}.vfr{background:#DDF7E8;color:#0B6339}.mvfr{background:#DBEEF9;color:#14557A}.ifr{background:#FDE4E1;color:#8A2017}.lifr{background:#F1E5FF;color:#6921A5}.caution{background:#FEF3C7;color:#7C3A06}.neutral{background:rgba(128,149,168,.15);color:var(--mut)}
[data-theme=dark] .vfr{background:#123C2A;color:#76E6A8}[data-theme=dark] .mvfr{background:#10344A;color:#76CFF7}[data-theme=dark] .ifr{background:#4A1B17;color:#FF9E95}[data-theme=dark] .lifr{background:#341D4E;color:#D3B7FF}[data-theme=dark] .caution{background:#44350D;color:#FBD66C}
.heroOps{display:grid;grid-template-columns:1.5fr .9fr;gap:12px}.now{min-height:300px}.bigwx{font-size:clamp(55px,12vw,92px);font-weight:300;letter-spacing:-.07em}.airport{font-size:clamp(20px,4vw,32px);font-weight:700}.metar{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-word;color:var(--mut)}.advice{border-left:4px solid var(--blue);padding-left:12px}.advice.danger{border-color:var(--red)}.advice.warn{border-color:var(--amber)}.advice.ok{border-color:var(--green)}.advice h3{margin:0 0 7px}.list{margin:0;padding-left:20px}.list li{margin:7px 0}.tile{padding:14px;border-radius:16px;background:rgba(255,255,255,.18);border:1px solid var(--line);min-height:92px}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;font-size:13px;min-width:650px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.table th{background:rgba(128,149,168,.1);position:sticky;top:0}.empty{padding:28px;text-align:center;color:var(--mut)}.drop{border:1.5px dashed var(--line);padding:20px;border-radius:16px;text-align:center;background:rgba(255,255,255,.1)}.drop input{display:block;margin:12px auto 0;max-width:100%}.source{font-size:11px;color:var(--mut)}.timeline{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px;overflow:auto}.period{border:1px solid var(--line);border-radius:14px;padding:12px;min-width:120px}.period .time{font-weight:800}.bar{height:9px;border-radius:9px;background:rgba(128,149,168,.18);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#147D4A,#0B6FA4,#B45309,#B42318);width:65%}.footer{margin-top:16px;font-size:11px;color:var(--mut);text-align:center}.hidden{display:none!important}
@media(max-width:760px){.wrap{padding-left:11px;padding-right:11px}.g2,.g3,.g4,.heroOps{grid-template-columns:1fr}.timeline{grid-template-columns:repeat(6,135px)}.card{border-radius:17px;padding:14px}.actions .btn span{display:none}.top{align-items:flex-start}.hero h1{font-size:34px}.bigwx{font-size:68px}}

<body>
<canvas id="sky" aria-hidden="true"></canvas><div class="veil"></div>
<div class="wrap">
<header class="top">
 <div class="brand"><div class="mark" aria-label="FORBSPACE mark"><svg viewBox="0 0 64 64" fill="none"><path d="M10 39c9-13 20-17 33-9 5 3 9 3 12 0" stroke="white" stroke-width="5" stroke-linecap="round"/><path d="M13 48h38M25 48l-6 8M43 48l6 8" stroke="white" stroke-width="4" stroke-linecap="round"/><path d="M32 8l3 10 10 3-10 3-3 10-3-10-10-3 10-3 3-10Z" fill="white" opacity=".9"/></svg></div><div><div class="word">FORBSPACE</div><div class="small">Aviation Weather Intelligence</div></div></div>
 <div class="actions"><button class="btn" id="themeBtn" title="Toggle theme">☾</button><button class="btn" id="motionBtn" title="Toggle motion">Motion</button></div>
</header>
<nav class="nav" id="nav"></nav>
<main id="app"></main>
<div class="footer">FORBSPACE is an aviation weather information and planning aid. It is not an aviation authority, live tracking system, operational clearance tool, or substitute for current approved operational sources and qualified judgment.</div>
</div>
<script>
(()=>{"use strict";
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N=["day","dusk","moon","storm","cruise","approach","radar"], AV=["cruise","approach","radar"];
const S={tab:"ops",scene:"day",dark:matchMedia("(prefers-color-scheme:dark)").matches,motion:!matchMedia("(prefers-reduced-motion:reduce)").matches,metar:"HUEN 091000Z 17008KT 9999 BKN018 27/18 Q1017 NOSIG",taf:"",spe:"",airport:"HUEN",airportName:"Entebbe International",aircraft:null,aircraftRows:[],weatherRows:[],weatherFile:"",tafPeriods:[],hazards:[],lightning:[],apiUrl:"",lastUpdate:null};
const nav=[["ops","NOW"],["forecast","TAF"],["hazards","HAZARDS"],["ramp","RAMP"],["aircraft","AIRCRAFT"],["history","HISTORY"],["import","IMPORT"]];
const navHtml=()=>nav.map(x=>`<button class="${S.tab===x[0]?"active":""}" data-tab="${x[0]}">${x[1]}</button>`).join("");
$("#nav").innerHTML=navHtml();

function parseMetar(m){
 const o={raw:m,windDir:null,wind:0,gust:null,vis:null,rvr:null,cover:"",ceiling:null,temp:null,dew:null,qnh:null,phenomena:[],trend:""};
 let x=m.match(/\b(VRB|\d{3})(\d{2,3})(?:G(\d{2,3}))?KT\b/); if(x){o.windDir=x[1]=="VRB"?null:+x[1];o.wind=+x[2];o.gust=x[3]?+x[3]:null}
 if(/\bCAVOK\b/.test(m))o.vis=10000; x=m.match(/\b(\d{4})\b/); if(x)o.vis=+x[1];
 x=m.match(/\b(\d{4})[NS]FT\b/); if(x)o.vis=o.vis??null;
 x=m.match(/\bR(\d{2}[LCR]?)\/([MP]?\d{4})(?:V[MP]?\d{4})?(?:FT)?\b/); if(x)o.rvr=x[2];
 let c; for(const q of m.matchAll(/\b(FEW|SCT|BKN|OVC|VV)(\d{3})(CB|TCU)?\b/g)){const h=+q[2]*100;if(q[1]=="BKN"||q[1]=="OVC"||q[1]=="VV"){if(c==null||h<c)c=h}o.cover=q[1]+(q[3]||"")}
 x=m.match(/\b(M?\d{2})\/(M?\d{2})\b/);if(x){const f=v=>v[0]=="M"?-+v.slice(1):+v;o.temp=f(x[1]);o.dew=f(x[2])}
 x=m.match(/\bQ(\d{4})\b/);if(x)o.qnh=+x[1]; else {x=m.match(/\bA(\d{4})\b/);if(x)o.qnh=Math.round(+x[1]/100*33.8639)}
 o.ceiling=c;
 const ph=m.match(/(?:^|\s)(\+|-)?(TS|TSRA|RA|SHRA|DZ|FG|BR|HZ|SN|SG|IC|GR|GS|FZRA|FZDZ)(?:\s|$)/g)||[];o.phenomena=ph.map(x=>x.trim());
 if(/\bNOSIG\b/.test(m))o.trend="NOSIG";else if(/\bBECMG\b/.test(m))o.trend="BECMG";else if(/\bTEMPO\b/.test(m))o.trend="TEMPO";
 o.night=/\b\d{6}Z\b/.test(m)?null:null; return o;
}
function category(o){if(o.vis==null||o.ceiling==null)return"VFR";let c=o.vis<500||o.ceiling<200?"LIFR":o.vis<1500||o.ceiling<500?"IFR":o.vis<5000||o.ceiling<1000?"MVFR":"VFR";return c}
function catClass(c){return c.toLowerCase()}
function windCross(dir,spd,rwy){if(dir==null)return null;let a=((dir-rwy+540)%360)-180;return Math.abs(spd*Math.sin(a*Math.PI/180))}
function runwayFromWind(dir){return dir==null?"—":String(Math.round(dir/10)||36).padStart(2,"0")}
function decodedLine(o){const parts=[];if(o.windDir!=null||o.wind)parts.push("Wind "+fmtWind(o));if(o.vis!=null)parts.push("Visibility "+fmtVis(o.vis));if(o.ceiling!=null)parts.push("Ceiling "+o.ceiling.toLocaleString()+" ft");if(o.temp!=null)parts.push("Temp/Dew "+o.temp+"°C / "+o.dew+"°C");if(o.qnh!=null)parts.push("QNH "+o.qnh+" hPa");if(o.phenomena.length)parts.push(o.phenomena.join(" "));if(o.trend)parts.push(o.trend);return parts.join(" · ")||"No decoded fields";}
function advice(o,a){
 const items=[], actions=[];let level="ok";
 const cross=a?windCross(o.windDir,o.gust??o.wind,+a.runway||170):null;
 if(o.phenomena.some(x=>/TS|GR|GS/.test(x))){items.push("Thunderstorm / convective weather reported. Avoid or follow the applicable operator thunderstorm procedure.");level="danger"}
 if(o.vis!=null && a && o.vis<a.minVis){items.push(`Visibility ${fmtVis(o.vis)} is below the selected aircraft profile minimum of ${fmtVis(a.minVis)}.`);level="danger"}
 if(o.ceiling!=null && a && o.ceiling<a.minCeil){items.push(`Ceiling ${o.ceiling.toLocaleString()} ft is below the selected profile minimum of ${a.minCeil.toLocaleString()} ft.`);level="danger"}
 if(cross!=null && a && cross>a.crosswind){items.push(`Estimated crosswind ${Math.round(cross)} kt exceeds the profile limit of ${a.crosswind} kt on runway ${String(a.runway).padStart(2,"0")}.`);level="danger"} else if(cross!=null&&a&&cross>=a.crosswind*.8){items.push(`Estimated crosswind ${Math.round(cross)} kt is at ${Math.round(cross/a.crosswind*100)}% of the selected profile limit.`);level=level=="danger"?level:"warn"}
 if((o.gust??0)>25){items.push(`Gust ${o.gust} kt: secure ground equipment and review ramp restrictions.`);level=level=="danger"?level:"warn"}
 if(o.temp!=null&&a&&a.maxTemp!=null&&o.temp>a.maxTemp){items.push(`Temperature ${o.temp}°C exceeds the selected aircraft profile maximum of ${a.maxTemp}°C.`);level="danger"}
 if(o.phenomena.some(x=>/FG|BR/.test(x))){items.push("Fog/mist reported: expect reduced visibility and possible turnaround delay.");level=level=="danger"?level:"warn"}
 if(o.qnh!=null)actions.push(`QNH ${o.qnh} hPa — use current approved operational value.`);
 if((o.gust??o.wind)>25)actions.push("Ramp: secure GSE, loose equipment and ULDs; apply the operator's gust procedure.");
 if(o.phenomena.length)actions.push("Dispatch/flight crew: review current SIGMET/TAF and company weather procedures.");
 if(!items.length){items.push("No selected-profile threshold is currently triggered by the entered METAR.");}
 return {level,items,actions,cross};
}
function fmtVis(v){return v==null?"—":v>=9999?"10+ km":(v/1000).toFixed(v<5000?1:0)+" km"}
function fmtWind(o){return o.windDir==null?`VRB/${String(o.wind).padStart(2,"0")}${o.gust?"G"+o.gust:""} kt`:`${String(o.windDir).padStart(3,"0")}/${String(o.wind).padStart(2,"0")}${o.gust?"G"+o.gust:""} kt`}
function save(){try{localStorage.setItem("forbspace-aircraft",JSON.stringify(S.aircraftRows));localStorage.setItem("forbspace-airport",S.airport)}catch(e){}}
try{S.aircraftRows=JSON.parse(localStorage.getItem("forbspace-aircraft")||"[]");S.aircraft=S.aircraftRows[0]||null}catch(e){}

function parseCSV(t){const rows=[];let row=[],cell="",q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c=='"'&&q&&n=='"'){cell+='"';i++;continue}if(c=='"'){q=!q;continue}if(c==','&&!q){row.push(cell);cell="";continue}if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&n=='\n')i++;row.push(cell);cell="";if(row.some(v=>v.trim()))rows.push(row);row=[];continue}cell+=c}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return{headers:rows[0]||[],rows:rows.slice(1)}}
function jsonTable(j){const a=Array.isArray(j)?j:j.data||j.records||j.aircraft||j.observations;if(!Array.isArray(a)||!a.length)throw Error("JSON must contain an array of records");const h=[...new Set(a.flatMap(x=>Object.keys(x)))];return{headers:h,rows:a.map(x=>h.map(k=>x[k]??""))}}
async function readXlsx(buf){const u=new Uint8Array(buf),dv=new DataView(buf),td=new TextDecoder();let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw Error("invalid XLSX");const n=dv.getUint16(e+10,true),p0=dv.getUint32(e+16,true),F={};let p=p0;for(let i=0;i<n;i++){const nl=dv.getUint16(p+28,true);F[td.decode(u.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),z:dv.getUint32(p+20,true),o:dv.getUint32(p+42,true)};p+=46+nl+dv.getUint16(p+30,true)+dv.getUint16(p+32,true)}const get=async k=>{const f=F[k];if(!f)return null;const st=f.o+30+dv.getUint16(f.o+26,true)+dv.getUint16(f.o+28,true),d=u.subarray(st,st+f.z);if(f.m===0)return td.decode(d);if(!("DecompressionStream"in window))throw Error("This device cannot unzip XLSX; save the sheet as CSV");return await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()};const xml=t=>new DOMParser().parseFromString(t,"application/xml"),sk=Object.keys(F).find(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k));if(!sk)throw Error("No worksheet");const ss=await get("xl/sharedStrings.xml"),strs=ss?[...xml(ss).getElementsByTagName("si")].map(si=>[...si.getElementsByTagName("t")].map(x=>x.textContent).join("")):[];const rs=[];for(const r of xml(await get(sk)).getElementsByTagName("row")){const rr=[];for(const c of r.getElementsByTagName("c")){const ref=c.getAttribute("r")||"",L=ref.replace(/\d/g,"");let ci=0;for(const ch of L)ci=ci*26+ch.charCodeAt(0)-64;ci=L?ci-1:rr.length;const v=c.getElementsByTagName("v")[0],is=c.getElementsByTagName("is")[0],t=c.getAttribute("t");rr[ci]=t=="s"?strs[+(v?.textContent||0)]??"":t=="inlineStr"&&is?[...is.getElementsByTagName("t")].map(x=>x.textContent).join(""):(v?.textContent||"")}rs.push(rr)}const w=Math.max(...rs.map(r=>r.length));return{headers:rs[0]||[],rows:rs.slice(1).map(r=>Array.from({length:w},(_,i)=>String(r[i]??"")))}}
async function fileTable(f){const ext=f.name.split(".").pop().toLowerCase();if(ext=="xlsx")return readXlsx(await f.arrayBuffer());if(ext=="json")return jsonTable(JSON.parse(await f.text()));return parseCSV(await f.text())}
function col(h,tests){const low=h.map(x=>x.toLowerCase().replace(/[^a-z0-9]/g,""));return tests.map(t=>low.findIndex(x=>x.includes(t))).find(i=>i>=0)??-1}
function num(x){const v=parseFloat(String(x).replace(/[^\d.-]/g,""));return Number.isFinite(v)?v:null}
function ingestAircraft(t){const h=t.headers,idx={type:col(h,["aircrafttype","type","variant"]),cat:col(h,["category"]),cross:col(h,["crosswind"]),tail:col(h,["tailwind"]),maxTemp:col(h,["maxtemp","maxoperatingtemp"]),icing:col(h,["icing","fiki"]),minVis:col(h,["takeofflandingvisibility","minvis","visibilityminimum"]),minCeil:col(h,["minimumceiling","minceiling","ceiling"]),runway:col(h,["runway","rwy","heading"])};S.aircraftRows=t.rows.map(r=>({type:r[idx.type>=0?idx.type:0]||"Unknown",category:r[idx.cat]||"Medium",crosswind:num(r[idx.cross])??35,tailwind:num(r[idx.tail])??10,maxTemp:num(r[idx.maxTemp])??50,icing:String(r[idx.icing]??"Unknown"),minVis:num(r[idx.minVis])??550,minCeil:num(r[idx.minCeil])??200,runway:num(r[idx.runway])??170}));S.aircraft=S.aircraftRows[0]||null;save()}
function ingestWeather(t){const h=t.headers,i={metar:col(h,["metar","rawmetar"]),airport:col(h,["icao","airport","station"]),time:col(h,["timestamp","datetime","date","time"]),taf:col(h,["taf"]),hazard:col(h,["sigmet","airmet","hazard"])};S.weatherRows=t.rows.map(r=>({metar:i.metar>=0?r[i.metar]:"",airport:i.airport>=0?r[i.airport]:"",time:i.time>=0?r[i.time]:"",taf:i.taf>=0?r[i.taf]:"",hazard:i.hazard>=0?r[i.hazard]:""}));const first=S.weatherRows.find(r=>r.metar&&(!r.airport||r.airport==S.airport))||S.weatherRows.find(r=>r.metar);if(first){S.metar=first.metar.trim();if(first.airport)S.airport=first.airport.trim().toUpperCase();if(first.taf)S.taf=first.taf;S.lastUpdate=new Date().toISOString()}}

function tafTimeline(raw){if(!raw)return[];const toks=raw.trim().split(/\s+/),out=[];for(let i=0;i<toks.length;i++){const m=toks[i].match(/^(\d{2})(\d{2})\/(\d{2})(\d{2})$/);if(m){out.push({time:`${m[1]}${m[2]}–${m[3]}${m[4]}Z`,text:toks.slice(i+1,Math.min(i+6,toks.length)).join(" "),cat:/(TS|CB)/.test(toks.slice(i,i+8).join(" "))?"IFR":"VFR"})}}return out.length?out:[{time:"TAF",text:raw,cat:"VFR"}]}

function ops(){
 const o=parseMetar(S.metar),c=category(o),a=S.aircraft,ad=advice(o,a),rwy=runwayFromWind(o.windDir),cross=ad.cross;
 const metarBlock=S.rawView?`<div class="section"><code>${esc(S.metar)}</code></div><div class="section small">Decoded: ${esc(decodedLine(o))}</div>`:`<div class="section small"><b>Decoded:</b> ${esc(decodedLine(o))}</div>`;
 return `<section class="heroOps">
 <div class="card now"><div class="row"><div><div class="label">Selected airport</div><div class="airport">${esc(S.airport)} · ${esc(S.airport=="HUEN"?"Entebbe International":"Airport")}</div></div><span class="status ${catClass(c)}">${c}</span></div>
 <div class="bigwx">${o.temp!=null?o.temp+"°":"—"}</div><div class="muted">${o.phenomena.join(" ")||"Current observation"} · QNH ${o.qnh??"—"} hPa</div>
 <div class="section metar"><div class="row"><b>METAR / SPECI</b><button class="btn" id="rawToggle">${S.rawView?"Decoded only":"Raw + Decoded"}</button></div>${metarBlock}</div><div class="section small">Updated ${S.lastUpdate?new Date(S.lastUpdate).toISOString().replace("T"," ").slice(0,16)+"Z":"manual / imported"} · UTC</div></div>
 <div class="card"><div class="label">Aircraft-aware advice</div><div class="section advice ${ad.level}"><h3>${ad.level=="danger"?"NOT RECOMMENDED":ad.level=="warn"?"CAUTION":"NO PROFILE TRIGGER"}</h3><ul class="list">${ad.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div class="section small">Profile: ${esc(a?.type||"None selected")}</div></div>
 </section>
 <section class="section grid g4">${tile("Wind",fmtWind(o),"METAR wind")}${tile("Visibility",fmtVis(o.vis),"reported")}${tile("Ceiling",o.ceiling!=null?o.ceiling.toLocaleString()+" ft":"No ceiling","lowest BKN/OVC/VV")}${tile("RVR",o.rvr||"—","runway visual range")}</section>
 <section class="section card"><div class="row"><div><h2 style="margin:0">Turnaround weather dashboard</h2><div class="small">Operational awareness — verify against current approved sources.</div></div><span class="chip">RWY ${rwy}</span></div>
 <div class="grid g3 section">${tile("Crosswind",cross!=null?Math.round(cross)+" kt":"—",a?`profile limit ${a.crosswind} kt`:"select aircraft")}${tile("Ramp risk",(o.gust??o.wind)>25?"High gust":"Normal",o.gust?`gust ${o.gust} kt`:"wind below 25 kt")}${tile("Temperature",o.temp!=null?o.temp+"°C":"—",o.dew!=null?`dew point ${o.dew}°C`:"")}</div>
 <div class="section advice ${ad.level}"><b>Recommended checks</b><ul class="list">${ad.actions.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></section>
 <section class="section card"><div class="row"><div><div class="label">Visual mode</div><div class="small">Illustrative background only — never live or measured weather.</div></div></div><div class="chips section">${N.map(n=>`<button class="btn ${S.scene===n?"primary":""}" data-scene="${n}">${n.toUpperCase()}</button>`).join("")}</div></section>`;
}
function tile(k,v,s){return `<div class="tile"><div class="label">${k}</div><div class="value">${v}</div><div class="small">${esc(s)}</div></div>`}

function forecast(){const p=tafTimeline(S.taf);return `<section class="card"><div class="row"><div><div class="label">${S.airport} TAF</div><h2 style="margin:3px 0">Next 6–30 hours</h2></div><span class="chip">UTC</span></div><div class="section field"><label>TAF / TAF AMD / TAF COR</label><textarea id="tafInput" placeholder="Paste current TAF here">${esc(S.taf)}</textarea></div><div class="section"><button class="btn primary" id="applyTaf">Update timeline</button></div><div class="timeline section">${p.map(x=>`<div class="period"><div class="time">${esc(x.time)}</div><div class="status ${catClass(x.cat)} section">${x.cat}</div><p class="small">${esc(x.text)}</p></div>`).join("")}</div><p class="source section">Timeline is a readable presentation layer; the raw TAF remains available above. Final flight planning must use the current authoritative TAF.</p></section>`}
function hazards(){const o=parseMetar(S.metar),hasTS=o.phenomena.some(x=>/TS/.test(x));return `<section class="grid g2"><div class="card"><div class="label">Active weather hazards</div><h2>${hasTS?"Thunderstorm reported":"No convective hazard parsed from METAR"}</h2><ul class="list">${o.phenomena.length?o.phenomena.map(x=>`<li>${esc(x)}</li>`).join(""):"<li>Paste current SIGMET/AIRMET information in the import panel for operational hazard review.</li>"}</ul></div><div class="card"><div class="label">Lightning / Radar</div><h2>Data-ready layer</h2><p class="muted">The dashboard reserves this panel for an authoritative lightning/radar feed. Decorative animation never represents live measured returns.</p><div class="status neutral">NO LIVE FEED CONNECTED</div></div></section><section class="section card"><div class="label">SIGMET / AIRMET / NOTAM weather text</div><textarea id="hazardInput" placeholder="Paste current SIGMET, AIRMET or weather-related NOTAM text here">${esc(S.hazards.join("\\n"))}</textarea><div class="section"><button class="btn primary" id="saveHaz">Save hazard notes</button></div></section>`}
function ramp(){const o=parseMetar(S.metar),a=S.aircraft;return `<section class="grid g3">${tile("Crosswind",a&&o.windDir!=null?Math.round(windCross(o.windDir,o.gust??o.wind,a.runway))+" kt":"—",a?`RWY ${a.runway} · limit ${a.crosswind} kt`:"Select aircraft")}${tile("Gust",o.gust!=null?o.gust+" kt":"—",o.gust>25?"Secure GSE":"Monitor")}${tile("Heat",o.temp!=null?o.temp+"°C":"—",o.temp>30?"Heat-stress awareness":"Normal")}</section><section class="section card"><h2>Ramp actions</h2><ul class="list"><li>Lightning/TS: follow the airport and operator ramp-stop criteria; this app does not create an ICAO-wide distance rule.</li><li>Gusts above 25 kt: secure GSE, ULDs, doors and loose equipment per local procedure.</li><li>Heavy rain or reduced visibility: anticipate slower turnaround and surface-conditions checks.</li></ul></section>`}
function aircraft(){return `<section class="card"><div class="row"><div><div class="label">Aircraft profile</div><h2>Upload once, advise against the selected profile</h2></div><span class="chip">${S.aircraftRows.length} profiles</span></div><p class="muted">Accepted: CSV, XLSX or JSON. Recommended columns: Type, Category, Crosswind, Tailwind, MaxTemp, Icing/FIKI, MinVis, MinCeiling, Runway.</p><div class="drop"><b>Aircraft list</b><input type="file" id="aircraftFile" accept=".csv,.xlsx,.json"></div><div class="section field"><label>Selected aircraft<select id="aircraftSel"><option value="">— none —</option>${S.aircraftRows.map((a,i)=>`<option value="${i}" ${S.aircraft===a?"selected":""}>${esc(a.type)} · ${esc(a.category)}</option>`).join("")}</select></label></div>${S.aircraft?`<div class="section grid g4">${tile("Type",S.aircraft.type,"selected profile")}${tile("Crosswind",S.aircraft.crosswind+" kt","profile input")}${tile("Min visibility",fmtVis(S.aircraft.minVis),"profile input")}${tile("Icing/FIKI",S.aircraft.icing,"profile input")}</div>`:""}<div class="section tableWrap"><table class="table"><tr><th>Type</th><th>Category</th><th>Crosswind</th><th>Tailwind</th><th>Max Temp</th><th>Min Vis</th><th>Min Ceiling</th></tr>${S.aircraftRows.map(a=>`<tr><td>${esc(a.type)}</td><td>${esc(a.category)}</td><td>${a.crosswind} kt</td><td>${a.tailwind} kt</td><td>${a.maxTemp}°C</td><td>${fmtVis(a.minVis)}</td><td>${a.minCeil} ft</td></tr>`).join("")||`<tr><td colspan="7">No aircraft profiles loaded.</td></tr>`}</table></div></section>`}
function history(){return `<section class="card"><div class="label">Historical analytics</div><h2>Weather file → long-term analysis</h2><p class="muted">Use the existing FORBSPACE historical engine for 10-year monthly observations. This operational shell accepts the same CSV/XLSX/JSON formats and keeps historical observations separate from live/forecast information.</p><button class="btn primary" id="openHistory">Open historical analytics</button></section><section class="section grid g3">${tile("File rows",S.weatherRows.length||"—","imported observation rows")}${tile("Airport",S.airport,"selected station")}${tile("Latest METAR",S.weatherRows.length?"loaded":"manual","source state")}</section>`}
function importer(){return `<section class="grid g2"><div class="card"><div class="label">1 · Weather observations</div><h2>Upload weather file</h2><p class="muted">CSV, XLSX or JSON. Raw METAR is preferred for the live-style panel; historical rows can contain timestamp, ICAO, wind, visibility, cloud, temperature, dew point, pressure and precipitation.</p><div class="drop"><input type="file" id="weatherFile" accept=".csv,.xlsx,.json"></div><div class="small section">Nothing is sent to a server by this bundled app.</div></div><div class="card"><div class="label">2 · Manual current observation</div><h2>METAR / SPECI</h2><div class="field"><label>ICAO<input id="icao" value="${esc(S.airport)}" maxlength="4"></label></div><div class="field section"><label>METAR / SPECI<textarea id="metarInput">${esc(S.metar)}</textarea></label></div><button class="btn primary section" id="applyMetar">Apply current observation</button></div></section><section class="section card"><div class="label">3 · Optional live observation feed</div><div class="grid g2"><div class="field"><label>Secure backend / CORS endpoint returning current METAR<input id="liveUrl" value="${esc(S.liveUrl)}" placeholder="https://your-backend.example/metar/HUEN"></label></div><div class="wraprow" style="align-items:end"><button class="btn primary" id="liveFetch">Fetch now</button><span class="status neutral">Auto-refresh: 30 min</span></div></div><p class="source section">Client-side API keys are intentionally not supported. Use a secure backend that normalizes an authorized source.</p></section><section class="section card"><div class="label">4 · Data-quality gate</div><div class="grid g3">${tile("Weather rows",S.weatherRows.length,"loaded in memory")}${tile("Aircraft profiles",S.aircraftRows.length,"saved locally on this device")}${tile("Live API",S.apiUrl?"configured":"not connected","authoritative source required")}</div><p class="source section">For production live operations, connect an approved source such as Uganda CAA/authorized MET, NOAA Aviation Weather Center, AVWX or CheckWX through a secure backend. API credentials should never be embedded in a public client.</p></section>`}

function render(){S.tab=S.tab||"ops";$("#nav").innerHTML=navHtml();let body=S.tab=="ops"?ops():S.tab=="forecast"?forecast():S.tab=="hazards"?hazards():S.tab=="ramp"?ramp():S.tab=="aircraft"?aircraft():S.tab=="history"?history():importer();$("#app").innerHTML=body;bind()}
function bind(){
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
 $("#themeBtn")?.addEventListener("click",()=>{S.dark=!S.dark;applyTheme()});
 $("#motionBtn")?.addEventListener("click",()=>{S.motion=!S.motion});
 $("#applyMetar")?.addEventListener("click",()=>{S.airport=($("#icao").value||"HUEN").toUpperCase().trim();S.metar=$("#metarInput").value.trim();S.lastUpdate=new Date().toISOString();render();setSceneFromMetar()});
 $("#applyTaf")?.addEventListener("click",()=>{S.taf=$("#tafInput").value.trim();render()});
 $("#saveHaz")?.addEventListener("click",()=>{S.hazards=$("#hazardInput").value.split(/\n+/).filter(Boolean);render()});
 $("#aircraftSel")?.addEventListener("change",e=>{S.aircraft=S.aircraftRows[+e.target.value]||null;save();render()});
 $("#aircraftFile")?.addEventListener("change",async e=>{try{const t=await fileTable(e.target.files[0]);ingestAircraft(t);render()}catch(err){alert("Aircraft file could not be read: "+err.message)}});
 $("#weatherFile")?.addEventListener("change",async e=>{try{const t=await fileTable(e.target.files[0]);ingestWeather(t);render();setSceneFromMetar()}catch(err){alert("Weather file could not be read: "+err.message)}});
 $("#liveFetch")?.addEventListener("click",()=>{S.liveUrl=$("#liveUrl").value.trim();fetchLive()});
 $("#openHistory")?.addEventListener("click",()=>{location.href="historical.html"});
}
async function fetchLive(){if(!S.liveUrl)return;try{const r=await fetch(S.liveUrl,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const text=await r.text();let j;try{j=JSON.parse(text)}catch(e){j=null}S.metar=(j?.metar||j?.data?.metar||text).trim();S.lastUpdate=new Date().toISOString();setSceneFromMetar();render()}catch(e){console.warn("Live feed failed",e)}}
setInterval(()=>{if(S.liveUrl&&navigator.onLine)fetchLive()},1800000);
function applyTheme(){document.documentElement.dataset.theme=S.dark?"dark":"light";$("#themeBtn").textContent=S.dark?"☀":"☾"}
function setSceneFromMetar(){const o=parseMetar(S.metar);if(AV.includes(S.scene))return;let n="day";if(o.phenomena.some(x=>/TS|GR/.test(x)))n="storm";else if(o.phenomena.some(x=>/RA|DZ/.test(x)))n="dusk";else if(o.phenomena.some(x=>/FG|BR/.test(x))||o.vis!=null&&o.vis<1000)n="moon";setScene(n)}
function setScene(n){if(!N.includes(n))return;S.scene=n;dirty=true}
function setDark(b){S.dark=!!b;applyTheme()}
function setWeather(w={}){if(w.metar!=null)S.metar=String(w.metar);if(w.name)S.airport=w.name;if(w.condition){S.condition=w.condition}if(w.isNight)S.scene="moon";else setSceneFromMetar();S.lastUpdate=new Date().toISOString();render()}
window.setScene=setScene;window.setDark=setDark;window.setWeather=setWeather;

let ctx=$("#sky").getContext("2d"),W=0,H=0,dpr=1,last=performance.now(),t=0,dirty=true,clouds=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;$("#sky").width=W*dpr;$("#sky").height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);clouds=Array.from({length:34},(_,i)=>({x:Math.random()*W,y:H*(.08+Math.random()*.52),s:.55+Math.random()*1.8,layer:i%3}));}
function lerp(a,b,x){return a+(b-a)*x}function rgb(a,b,x){return a.map((v,i)=>Math.round(lerp(v,b[i],x)))}
const palettes={day:[[58,154,224],[207,238,255]],dusk:[[94,63,108],[245,166,112]],moon:[[5,17,37],[37,65,94]],storm:[[10,18,28],[63,74,85]],cruise:[[12,61,126],[92,176,226]],approach:[[12,18,47],[68,62,105]],radar:[[4,22,17],[18,73,49]]};
function drawCloud(x,y,s,a=1){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=S.dark?"rgba(110,135,153,.25)":"rgba(255,255,255,.55)";for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(x+(i-2.5)*28*s,y+(i%2)*6*s,26*s*(.75+(i%3)*.12),0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawMoon(){let r=Math.min(W,H)*.22,x=W*.78,y=H*.25+Math.sin(t*.08)*8;let g=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r*1.2);g.addColorStop(0,"#fff");g.addColorStop(.7,"#d9e4ef");g.addColorStop(1,"rgba(160,184,204,.05)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();for(let i=0;i<11;i++){ctx.fillStyle="rgba(100,120,138,.18)";ctx.beginPath();ctx.arc(x+(i*37%90-r/2),y+(i*53%110-r/2),5+(i%4)*3,0,Math.PI*2);ctx.fill()}}
function drawRunway(){let vp={x:W*.5,y:H*.43};ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=2;for(let i=0;i<8;i++){let p=lerp(.05,.9,i/8),y=vp.y+(H-vp.y)*p,w=lerp(3,W*.34,p);ctx.beginPath();ctx.moveTo(vp.x-w,y);ctx.lineTo(vp.x+w,y);ctx.stroke()}for(let i=0;i<9;i++){let p=i/9,y=vp.y+(H-vp.y)*p;ctx.fillStyle=i%2?"#fff":"#f6f0c9";ctx.fillRect(vp.x-3,y,6,Math.max(2,16*p))}ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(W*.5,vp.y,5,0,Math.PI*2);ctx.fill()}
function drawPlane(){let x=W*.62,y=H*.38+Math.sin(t*1.1)*6;ctx.save();ctx.translate(x,y);ctx.fillStyle="rgba(255,255,255,.9)";ctx.beginPath();ctx.ellipse(0,0,42,7,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(-30,20);ctx.lineTo(8,3);ctx.fill();ctx.beginPath();ctx.moveTo(-7,-2);ctx.lineTo(-22,-18);ctx.lineTo(6,-3);ctx.fill();ctx.restore();ctx.fillStyle="rgba(255,255,255,.16)";ctx.fillRect(x-130,y+2,90,2)}
function drawRadar(){let cx=W*.5,cy=H*.46,r=Math.min(W,H)*.38;ctx.fillStyle="rgba(1,18,12,.6)";ctx.fillRect(0,0,W,H);ctx.strokeStyle="rgba(72,255,162,.24)";for(let i=1;i<=4;i++){ctx.beginPath();ctx.arc(cx,cy,r*i/4,0,Math.PI*2);ctx.stroke()}ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.45);let g=ctx.createLinearGradient(0,0,r,0);g.addColorStop(0,"rgba(100,255,170,.5)");g.addColorStop(1,"rgba(100,255,170,0)");ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,-.18,.18);ctx.closePath();ctx.fill();ctx.restore();for(let i=0;i<8;i++){let a=i*1.9+1,rr=r*(.25+(i%4)*.14);ctx.fillStyle=i%3==0?"rgba(255,65,50,.8)":i%2?"rgba(255,208,50,.7)":"rgba(80,220,100,.6)";ctx.beginPath();ctx.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,5+i%3*3,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(cx,cy-13);ctx.lineTo(cx-8,cy+8);ctx.lineTo(cx,cy+4);ctx.lineTo(cx+8,cy+8);ctx.closePath();ctx.fill()}
function drawStorm(){for(let i=0;i<9;i++){ctx.fillStyle="rgba(8,13,20,.78)";ctx.beginPath();ctx.arc(W*(.18+i*.09),H*.33+Math.sin(i)*12,75+i*7,0,Math.PI*2);ctx.fill()}if(Math.floor(t)%5===0&&Math.random()<.08){ctx.strokeStyle="rgba(255,255,230,.9)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W*.65,H*.2);ctx.lineTo(W*.61,H*.42);ctx.lineTo(W*.67,H*.55);ctx.stroke()}}
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;ctx.clearRect(0,0,W,H);let pal=palettes[S.scene]||palettes.day;let g=ctx.createLinearGradient(0,0,0,H),a=rgb(pal[0],[0,0,0],S.dark?.22:0),b=rgb(pal[1],[0,0,0],S.dark?.22:0);g.addColorStop(0,`rgb(${a})`);g.addColorStop(1,`rgb(${b})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(S.scene=="moon"){drawMoon();for(let i=0;i<70;i++){ctx.fillStyle=`rgba(255,255,255,${.2+((i*17)%10)/20})`;ctx.fillRect((i*97)%W,(i*53)%H,1.5,1.5)}}
 if(S.scene=="radar")drawRadar();else{for(const c of clouds){c.x-=dt*(S.scene=="cruise"?45:8)*(c.layer+1)/3;if(c.x<-160)c.x=W+160;drawCloud(c.x,c.y+Math.sin(t*.15+c.layer)*4,c.s*(.55+c.layer*.35),.12+c.layer*.05)}if(S.scene=="storm")drawStorm();if(S.scene=="approach")drawRunway();if(S.scene=="cruise")drawPlane();if(S.scene=="day"||S.scene=="dusk"){ctx.fillStyle=S.scene=="dusk"?"rgba(255,183,92,.65)":"rgba(255,244,173,.75)";ctx.beginPath();ctx.arc(W*.78,H*.18,42+Math.sin(t*.4)*3,0,Math.PI*2);ctx.fill()}}
 if(S.motion&&S.scene=="approach"){ctx.save();ctx.globalAlpha=.13;ctx.fillStyle="#fff";for(let i=0;i<80;i++){let x=(i*97+t*40)%W,y=(i*53+t*90)%H;ctx.fillRect(x,y,1,9)}ctx.restore()}
 requestAnimationFrame(frame)}
addEventListener("resize",resize);resize();applyTheme();setSceneFromMetar();render();requestAnimationFrame(frame);
})();
</script>
</body></html>
