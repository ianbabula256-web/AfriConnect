 return `<section class="card" aria-labelledby="pf"><h2 id="pf" style="margin:0 0 4px">Airport weather profile</h2><p class="sub" style="margin:0 0 8px"><b>${esc(apName())}</b> · ${esc(period())} · historical records only</p>
